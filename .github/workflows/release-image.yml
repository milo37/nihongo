name: Release image

# Publishes ECR:<SHA> (runtime) and ECR:<SHA>-migrate for the host's deploy.sh.
# Skipped until the repository variables AWS_DEPLOY_ROLE_ARN (terraform output
# github_deploy_role_arn), ECR_REPOSITORY_URL and AWS_REGION are set. The role
# trusts main only (infra/aws/github.tf).
# Then deploys the same SHA to STAGING through the host's SSM deploy document
# (the role may send only that document to that one instance) and waits for
# /health/ready. Skipped until STAGING_INSTANCE_ID (terraform output
# instance_id) and STAGING_SITE_URL (output site_url) are set as well.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish runtime and migrate images
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.ECR_REPOSITORY_URL != '' && vars.AWS_REGION != ''
    # The host is Graviton (t4g), so the images are built natively on arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assume the deploy role (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        run: |
          aws ecr get-login-password \
            | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"

      # ECR tags are immutable. A second run of the same SHA (Re-run, or a
      # manual dispatch after a host-side deploy) keeps the tags that already
      # exist instead of failing on them, and goes on to Deploy to STAGING.
      - name: Find tags already in ECR
        id: existing
        run: |
          repo="${ECR_REPOSITORY_URL#*/}"
          for kind in migrate runtime; do
            tag="$GITHUB_SHA"
            [ "$kind" = migrate ] && tag="$GITHUB_SHA-migrate"
            if err=$(aws ecr describe-images --repository-name "$repo" \
                --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' \
                --output text 2>&1 >/dev/null); then
              echo "$kind=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$tag is already in ECR; it is not built or pushed again"
            elif printf '%s' "$err" | grep -q ImageNotFoundException; then
              echo "$kind=false" >> "$GITHUB_OUTPUT"
            else
              # The repository is public: no AWS error text in the log.
              echo "::error::could not check $tag in ECR"
              exit 1
            fi
          done

      - name: Build
        if: steps.existing.outputs.migrate != 'true' || steps.existing.outputs.runtime != 'true'
        env:
          HAS_MIGRATE: ${{ steps.existing.outputs.migrate }}
          HAS_RUNTIME: ${{ steps.existing.outputs.runtime }}
        run: |
          if [ "$HAS_RUNTIME" != true ]; then
            docker build --build-arg RELEASE_ID="$GITHUB_SHA" \
              --tag "$ECR_REPOSITORY_URL:$GITHUB_SHA" .
          fi
          if [ "$HAS_MIGRATE" != true ]; then
            docker build --target migrate --build-arg RELEASE_ID="$GITHUB_SHA" \
              --tag "$ECR_REPOSITORY_URL:$GITHUB_SHA-migrate" .
          fi

      # Migrate first: a runtime tag never exists without its migrate image.
      - name: Push
        if: steps.existing.outputs.migrate != 'true' || steps.existing.outputs.runtime != 'true'
        env:
          HAS_MIGRATE: ${{ steps.existing.outputs.migrate }}
          HAS_RUNTIME: ${{ steps.existing.outputs.runtime }}
        run: |
          if [ "$HAS_MIGRATE" != true ]; then
            docker push "$ECR_REPOSITORY_URL:$GITHUB_SHA-migrate"
          fi
          if [ "$HAS_RUNTIME" != true ]; then
            docker push "$ECR_REPOSITORY_URL:$GITHUB_SHA"
          fi

  deploy-staging:
    name: Deploy to STAGING
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.STAGING_INSTANCE_ID != '' && vars.STAGING_SITE_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One deploy at a time: a running deploy is never cancelled. GitHub keeps
    # only the newest waiting run in the group, so a SHA that is still waiting
    # when a newer merge arrives is cancelled and STAGING goes to the newest.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    env:
      INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
      SITE_URL: ${{ vars.STAGING_SITE_URL }}
      DEPLOY_DOCUMENT: harumaru-staging-deploy
    steps:
      # Re-running an old run must not put STAGING back on an older SHA:
      # deploy only while this SHA is still the tip of main.
      - name: Check this SHA is the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github.sha' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main")
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipped: $GITHUB_SHA is not the tip of main ($tip); re-run the newest run instead"
          fi

      - name: Assume the deploy role (OIDC, no stored keys)
        if: steps.tip.outputs.latest == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The repository is public: print the status and the known result lines
      # of deploy.sh only, never the whole command output.
      - name: Run the deploy document on the host
        if: steps.tip.outputs.latest == 'true'
        run: |
          cid=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name "$DEPLOY_DOCUMENT" --parameters "releaseId=$GITHUB_SHA" \
            --comment "release-image $GITHUB_RUN_ID" \
            --query Command.CommandId --output text)
          echo "command $cid"
          deadline=$((SECONDS + 1500))
          while :; do
            st=$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            case "$st" in
              Pending|InProgress|Delayed|"") ;;
              *) break ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then echo "::error::deploy still $st after 25 minutes"; exit 1; fi
            sleep 15
          done
          echo "status $st"
          # One field per call: a text query of both fields joins them with a
          # tab, which would hide the first stderr line from the filter.
          for field in StandardOutputContent StandardErrorContent; do
            aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" \
              --query "$field" --output text
          done | grep -E '^(deployed [0-9a-f]{40}|refusing: |health check failed|rolled back|another deploy is running|release must be)' || true
          [ "$st" = Success ] || { echo "::error::deploy $st"; exit 1; }

      - name: Wait for /health/ready 200 with this release
        if: steps.tip.outputs.latest == 'true'
        run: |
          for _ in $(seq 1 30); do
            : > headers.txt
            code=$(curl -sS -o /dev/null -D headers.txt -w '%{http_code}' "$SITE_URL/health/ready" || true)
            release=$(tr -d '\r' < headers.txt | awk 'tolower($1)=="x-release-id:"{print $2}')
            if [ "$code" = 200 ] && { [ -z "$release" ] || [ "$release" = "$GITHUB_SHA" ]; }; then
              echo "ready 200 release ${release:-not shown by the edge}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL/health/ready gave $code (release ${release:-none})"
          exit 1
