name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'pull_request' && github.event.action == 'edited' && (startsWith(toJSON(github.event.changes.title.from), '"') || startsWith(toJSON(github.event.changes.body.from), '"')) && toJSON(github.event.changes) == toJSON(fromJSON(startsWith(toJSON(github.event.changes.title.from), '"') && startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"title":{{"from":{0}}},"body":{{"from":{1}}}}}', toJSON(github.event.changes.title.from), toJSON(github.event.changes.body.from)) || startsWith(toJSON(github.event.changes.title.from), '"') && format('{{"title":{{"from":{0}}}}}', toJSON(github.event.changes.title.from)) || startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"body":{{"from":{0}}}}}', toJSON(github.event.changes.body.from)) || '{}')) && format('-metadata-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select affected checks
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && (startsWith(toJSON(github.event.changes.title.from), '"') || startsWith(toJSON(github.event.changes.body.from), '"')) && toJSON(github.event.changes) == toJSON(fromJSON(startsWith(toJSON(github.event.changes.title.from), '"') && startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"title":{{"from":{0}}},"body":{{"from":{1}}}}}', toJSON(github.event.changes.title.from), toJSON(github.event.changes.body.from)) || startsWith(toJSON(github.event.changes.title.from), '"') && format('{{"title":{{"from":{0}}}}}', toJSON(github.event.changes.title.from)) || startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"body":{{"from":{0}}}}}', toJSON(github.event.changes.body.from)) || '{}'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
      code: ${{ steps.selection.outputs.code }}
      web: ${{ steps.selection.outputs.web }}
      admin: ${{ steps.selection.outputs.admin }}
      api: ${{ steps.selection.outputs.api }}
      database: ${{ steps.selection.outputs.database }}
      browser: ${{ steps.selection.outputs.browser }}
      browser_mock: ${{ steps.selection.outputs.browser_mock }}
      audit: ${{ steps.selection.outputs.audit }}
      performance: ${{ steps.selection.outputs.performance }}
      portable: ${{ steps.selection.outputs.portable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Select affected checks
        id: selection
        run: node scripts/ci/check-selection.mjs plan

  build:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && (startsWith(toJSON(github.event.changes.title.from), '"') || startsWith(toJSON(github.event.changes.body.from), '"')) && toJSON(github.event.changes) == toJSON(fromJSON(startsWith(toJSON(github.event.changes.title.from), '"') && startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"title":{{"from":{0}}},"body":{{"from":{1}}}}}', toJSON(github.event.changes.title.from), toJSON(github.event.changes.body.from)) || startsWith(toJSON(github.event.changes.title.from), '"') && format('{{"title":{{"from":{0}}}}}', toJSON(github.event.changes.title.from)) || startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"body":{{"from":{0}}}}}', toJSON(github.event.changes.body.from)) || '{}')) && format('Metadata edit / quality / {0}', github.run_id) || 'Quality and production build' }}
    if: ${{ always() && !(github.event_name == 'pull_request' && github.event.action == 'edited' && (startsWith(toJSON(github.event.changes.title.from), '"') || startsWith(toJSON(github.event.changes.body.from), '"')) && toJSON(github.event.changes) == toJSON(fromJSON(startsWith(toJSON(github.event.changes.title.from), '"') && startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"title":{{"from":{0}}},"body":{{"from":{1}}}}}', toJSON(github.event.changes.title.from), toJSON(github.event.changes.body.from)) || startsWith(toJSON(github.event.changes.title.from), '"') && format('{{"title":{{"from":{0}}}}}', toJSON(github.event.changes.title.from)) || startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"body":{{"from":{0}}}}}', toJSON(github.event.changes.body.from)) || '{}'))) }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_SELECTION: ${{ needs.plan.outputs.selection }}
      NODE_ENV: test
    steps:
      - name: Require successful impact classification
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Install dependencies
        if: ${{ needs.plan.outputs.code == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Formatting and whitespace
        if: ${{ needs.plan.outputs.code == 'true' }}
        run: node scripts/ci/check-selection.mjs format

      - name: Static analysis and source security
        if: ${{ needs.plan.outputs.code == 'true' }}
        run: node scripts/ci/check-selection.mjs quality static

      - name: TypeScript check
        if: ${{ needs.plan.outputs.code == 'true' }}
        run: node scripts/ci/check-selection.mjs quality typecheck

      - name: Dependency audit
        if: ${{ needs.plan.outputs.audit == 'true' }}
        run: node scripts/ci/check-selection.mjs quality audit

      - name: Production build
        if: ${{ needs.plan.outputs.code == 'true' }}
        env:
          NODE_ENV: production
          VITE_RELEASE_ID: ${{ github.sha }}
        run: node scripts/ci/check-selection.mjs quality build

      - name: Production bundle budget
        if: ${{ needs.plan.outputs.web == 'true' || needs.plan.outputs.admin == 'true' }}
        env:
          NODE_ENV: production
        run: node scripts/ci/check-selection.mjs quality bundle

  unit:
    name: Unit and static regression
    needs: plan
    if: ${{ needs.plan.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_SELECTION: ${{ needs.plan.outputs.selection }}
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: node scripts/ci/check-selection.mjs quality packages

      - name: Unit and static regression
        run: node scripts/ci/check-selection.mjs quality unit

  integration:
    name: API and database integration (${{ matrix.part }})
    needs: plan
    if: ${{ needs.plan.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [database, api-1, api-2, api-3]
    services:
      postgres:
        image: ${{ (needs.plan.outputs.api == 'true') && 'postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15' || '' }}
        env:
          POSTGRES_DB: nihongo_jlp534_test
          POSTGRES_USER: nihongo
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nihongo -d nihongo_jlp534_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI_SELECTION: ${{ needs.plan.outputs.selection }}
      DATABASE_URL: postgresql://nihongo:ci_only_password@127.0.0.1:5432/nihongo_jlp534_test?schema=public
      NODE_ENV: test
      TRUSTED_ORIGINS: http://localhost:5173
      LOG_LEVEL: silent
      BETTER_AUTH_SECRET: ci_auth_secret_that_is_at_least_32_chars
      BETTER_AUTH_URL: http://localhost:3001
      GUEST_COOKIE_SECRET: ci_guest_secret_that_is_at_least_32_chars
      AUTH_TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API and database integration
        run: node scripts/ci/check-selection.mjs quality integration-${{ matrix.part }}

  regression:
    name: Database performance and selected browser regression
    needs: plan
    if: ${{ needs.plan.outputs.browser == 'true' || needs.plan.outputs.performance == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: ${{ (needs.plan.outputs.browser == 'true' || needs.plan.outputs.performance == 'true') && 'postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15' || '' }}
        env:
          POSTGRES_DB: nihongo_jlp534_test
          POSTGRES_USER: nihongo
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nihongo -d nihongo_jlp534_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI_SELECTION: ${{ needs.plan.outputs.selection }}
      DATABASE_URL: postgresql://nihongo:ci_only_password@127.0.0.1:5432/nihongo_jlp534_test?schema=public
      NODE_ENV: test
      TRUSTED_ORIGINS: http://localhost:5173
      LOG_LEVEL: silent
      BETTER_AUTH_SECRET: ci_auth_secret_that_is_at_least_32_chars
      BETTER_AUTH_URL: http://localhost:3001
      GUEST_COOKIE_SECRET: ci_guest_secret_that_is_at_least_32_chars
      AUTH_TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128
      PLAYWRIGHT_EVIDENCE_DIR: test-results/browser-evidence/playwright-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_MOCK_EVIDENCE_DIR: test-results/browser-evidence/playwright-mock-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_DIAGNOSTIC_DIR: test-results/browser-diagnostics/playwright-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Playwright system package key
        id: playwright_debs_key
        if: ${{ needs.plan.outputs.browser == 'true' }}
        run: |
          version=$(pnpm exec playwright --version | awk '{print $2}')
          test -n "$version"
          echo "key=playwright-debs-${ImageOS}-${ImageVersion}-${version}" >> "$GITHUB_OUTPUT"

      # The Ubuntu apt mirrors are the part that fails on runner DNS. Keep the
      # .deb files the first successful install downloaded, keyed by runner image
      # and Playwright version, and install exactly those offline next time.
      - name: Restore Playwright system packages
        id: playwright_debs
        if: ${{ needs.plan.outputs.browser == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/playwright-debs
          key: ${{ steps.playwright_debs_key.outputs.key }}

      - name: Install Playwright Chromium
        if: ${{ needs.plan.outputs.browser == 'true' }}
        timeout-minutes: 30
        env:
          DEBS_CACHED: ${{ steps.playwright_debs.outputs.cache-hit }}
        # Runner DNS to the Ubuntu apt mirrors fails now and then; retry the whole install with backoff.
        run: |
          debs="$HOME/.cache/playwright-debs"
          shopt -s nullglob
          if [ "$DEBS_CACHED" = "true" ]; then
            cached_debs=("$debs"/*.deb)
            if [ "${#cached_debs[@]}" -gt 0 ]; then sudo dpkg -i "${cached_debs[@]}"; fi
            install_args="chromium"
          else
            echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
            echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/81-ci-keep-debs >/dev/null
            sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -delete
            install_args="--with-deps chromium"
          fi
          installed=false
          for attempt in 1 2 3; do
            if pnpm exec playwright install $install_args; then
              installed=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "::warning::Playwright install attempt ${attempt} failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          test "$installed" = true
          if [ "$DEBS_CACHED" != "true" ]; then
            mkdir -p "$debs"
            new_debs=(/var/cache/apt/archives/*.deb)
            if [ "${#new_debs[@]}" -gt 0 ]; then cp "${new_debs[@]}" "$debs"/; fi
          fi
          echo "system packages: $(ls "$debs" | wc -l) cached=${DEBS_CACHED:-false}"
          dpkg-query -W -f='${Package} ${Version}\n' 'fonts-*' | sort

      - name: Save Playwright system packages
        if: ${{ needs.plan.outputs.browser == 'true' && steps.playwright_debs.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/playwright-debs
          key: ${{ steps.playwright_debs_key.outputs.key }}

      - name: Database and API performance
        id: database_performance
        if: ${{ needs.plan.outputs.performance == 'true' }}
        run: node scripts/ci/check-selection.mjs quality performance

      - name: Initialize unique safe Playwright evidence
        id: playwright_initialize
        if: ${{ needs.plan.outputs.browser == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$PLAYWRIGHT_EVIDENCE_DIR"
          install -d -m 700 "$PLAYWRIGHT_EVIDENCE_DIR"

      - name: Real browser acceptance
        id: real_browser
        if: ${{ needs.plan.outputs.browser == 'true' }}
        run: pnpm run test:browser:real

      - name: Verify safe Playwright evidence
        id: playwright_evidence
        if: ${{ !cancelled() && steps.playwright_initialize.outcome == 'success' }}
        run: >-
          node scripts/security/security-evidence.mjs verify
          --directory "$PLAYWRIGHT_EVIDENCE_DIR"
          --profile playwright
          --required admin-dashboard-real,accessibility-real,journey-real

      - name: Upload safe Playwright evidence
        if: ${{ steps.playwright_evidence.outcome == 'success' && steps.real_browser.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-safe-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ env.PLAYWRIGHT_EVIDENCE_DIR }}/

      - name: Clean browser evidence
        if: ${{ always() && needs.plan.outputs.browser == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          expected="test-results/browser-evidence/playwright-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$PLAYWRIGHT_EVIDENCE_DIR" = "$expected"
          rm -rf -- "$expected" test-results/playwright-raw test-results/playwright-accessibility-real
          test ! -e "$expected"
          test ! -e test-results/playwright-raw
          test ! -e test-results/playwright-accessibility-real

      - name: Initialize unique safe Mock Playwright evidence
        id: mock_playwright_initialize
        if: ${{ needs.plan.outputs.browser_mock == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$PLAYWRIGHT_MOCK_EVIDENCE_DIR"
          install -d -m 700 "$PLAYWRIGHT_MOCK_EVIDENCE_DIR"

      - name: Mock browser acceptance
        id: mock_browser
        if: ${{ needs.plan.outputs.browser_mock == 'true' }}
        env:
          PLAYWRIGHT_EVIDENCE_DIR: ${{ env.PLAYWRIGHT_MOCK_EVIDENCE_DIR }}
        run: pnpm run test:browser:mock

      - name: Verify safe Mock Playwright evidence
        id: mock_playwright_evidence
        if: ${{ !cancelled() && steps.mock_playwright_initialize.outcome == 'success' }}
        run: >-
          node scripts/security/security-evidence.mjs verify
          --directory "$PLAYWRIGHT_MOCK_EVIDENCE_DIR"
          --profile playwright
          --required admin-dashboard-mock,accessibility-mock,journey-mock

      - name: Upload safe Mock Playwright evidence
        if: ${{ steps.mock_playwright_evidence.outcome == 'success' && steps.mock_browser.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-safe-evidence-mock-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ env.PLAYWRIGHT_MOCK_EVIDENCE_DIR }}/

      - name: Clean Mock browser evidence
        if: ${{ always() && needs.plan.outputs.browser_mock == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          expected="test-results/browser-evidence/playwright-mock-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$PLAYWRIGHT_MOCK_EVIDENCE_DIR" = "$expected"
          rm -rf -- "$expected" test-results/playwright-raw
          test ! -e "$expected"
          test ! -e test-results/playwright-raw

      # Failure-only: request ledgers the evidence check rejected, reduced to entries that pass the
      # per-entry safety checks (method, normalized path, status, provenance, sequence).
      - name: Upload rejected request ledger diagnostics
        if: ${{ !cancelled() && (steps.real_browser.outcome == 'failure' || steps.mock_browser.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ledger-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ env.PLAYWRIGHT_DIAGNOSTIC_DIR }}/

      - name: Clean request ledger diagnostics
        if: ${{ always() && (needs.plan.outputs.browser == 'true' || needs.plan.outputs.browser_mock == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          expected="test-results/browser-diagnostics/playwright-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$PLAYWRIGHT_DIAGNOSTIC_DIR" = "$expected"
          rm -rf -- "$expected"
          test ! -e "$expected"

      - name: Verify selected regression acceptance
        if: ${{ always() }}
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          JOB_RESULT: ${{ job.status }}
          PERFORMANCE_SELECTED: ${{ needs.plan.outputs.performance }}
          PERFORMANCE_OUTCOME: ${{ steps.database_performance.outcome }}
          BROWSER_SELECTED: ${{ needs.plan.outputs.browser }}
          REAL_OUTCOME: ${{ steps.real_browser.outcome }}
          EVIDENCE_INITIALIZE_OUTCOME: ${{ steps.playwright_initialize.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.playwright_evidence.outcome }}
          MOCK_SELECTED: ${{ needs.plan.outputs.browser_mock }}
          MOCK_OUTCOME: ${{ steps.mock_browser.outcome }}
          MOCK_EVIDENCE_INITIALIZE_OUTCOME: ${{ steps.mock_playwright_initialize.outcome }}
          MOCK_EVIDENCE_OUTCOME: ${{ steps.mock_playwright_evidence.outcome }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$JOB_RESULT" = success
          require_selected_step() {
            case "$1" in
              true) test "$2" = success ;;
              false) test "$2" = skipped ;;
              *) return 1 ;;
            esac
          }
          require_selected_step "$PERFORMANCE_SELECTED" "$PERFORMANCE_OUTCOME"
          require_selected_step "$BROWSER_SELECTED" "$REAL_OUTCOME"
          require_selected_step "$BROWSER_SELECTED" "$EVIDENCE_INITIALIZE_OUTCOME"
          require_selected_step "$BROWSER_SELECTED" "$EVIDENCE_OUTCOME"
          require_selected_step "$MOCK_SELECTED" "$MOCK_OUTCOME"
          require_selected_step "$MOCK_SELECTED" "$MOCK_EVIDENCE_INITIALIZE_OUTCOME"
          require_selected_step "$MOCK_SELECTED" "$MOCK_EVIDENCE_OUTCOME"

  acceptance:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && (startsWith(toJSON(github.event.changes.title.from), '"') || startsWith(toJSON(github.event.changes.body.from), '"')) && toJSON(github.event.changes) == toJSON(fromJSON(startsWith(toJSON(github.event.changes.title.from), '"') && startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"title":{{"from":{0}}},"body":{{"from":{1}}}}}', toJSON(github.event.changes.title.from), toJSON(github.event.changes.body.from)) || startsWith(toJSON(github.event.changes.title.from), '"') && format('{{"title":{{"from":{0}}}}}', toJSON(github.event.changes.title.from)) || startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"body":{{"from":{0}}}}}', toJSON(github.event.changes.body.from)) || '{}')) && format('Metadata edit / regression / {0}', github.run_id) || 'Browser and regression acceptance' }}
    if: ${{ always() && !(github.event_name == 'pull_request' && github.event.action == 'edited' && (startsWith(toJSON(github.event.changes.title.from), '"') || startsWith(toJSON(github.event.changes.body.from), '"')) && toJSON(github.event.changes) == toJSON(fromJSON(startsWith(toJSON(github.event.changes.title.from), '"') && startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"title":{{"from":{0}}},"body":{{"from":{1}}}}}', toJSON(github.event.changes.title.from), toJSON(github.event.changes.body.from)) || startsWith(toJSON(github.event.changes.title.from), '"') && format('{{"title":{{"from":{0}}}}}', toJSON(github.event.changes.title.from)) || startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"body":{{"from":{0}}}}}', toJSON(github.event.changes.body.from)) || '{}'))) }}
    needs: [plan, build, unit, integration, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful selected regression and build
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          CODE_SELECTED: ${{ needs.plan.outputs.code }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          REGRESSION_RESULT: ${{ needs.regression.result }}
          API_SELECTED: ${{ needs.plan.outputs.api }}
          PERFORMANCE_SELECTED: ${{ needs.plan.outputs.performance }}
          BROWSER_SELECTED: ${{ needs.plan.outputs.browser }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$BUILD_RESULT" = success
          for selected in "$API_SELECTED" "$PERFORMANCE_SELECTED" "$BROWSER_SELECTED"; do
            case "$selected" in true|false) ;; *) exit 1 ;; esac
          done
          case "$CODE_SELECTED" in
            true) test "$UNIT_RESULT" = success ;;
            false) test "$UNIT_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
          if [ "$API_SELECTED" = true ]; then
            test "$INTEGRATION_RESULT" = success
          else
            test "$INTEGRATION_RESULT" = skipped
          fi
          if [ "$PERFORMANCE_SELECTED" = true ] || [ "$BROWSER_SELECTED" = true ]; then
            test "$REGRESSION_RESULT" = success
          else
            test "$REGRESSION_RESULT" = skipped
          fi

  portable:
    name: Portable image and runtime smoke
    needs: plan
    if: ${{ needs.plan.outputs.portable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Portable image and runtime smoke
        env:
          RELEASE_ID: ${{ github.sha }}
        run: pnpm run test:portable

  release_smoke:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && (startsWith(toJSON(github.event.changes.title.from), '"') || startsWith(toJSON(github.event.changes.body.from), '"')) && toJSON(github.event.changes) == toJSON(fromJSON(startsWith(toJSON(github.event.changes.title.from), '"') && startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"title":{{"from":{0}}},"body":{{"from":{1}}}}}', toJSON(github.event.changes.title.from), toJSON(github.event.changes.body.from)) || startsWith(toJSON(github.event.changes.title.from), '"') && format('{{"title":{{"from":{0}}}}}', toJSON(github.event.changes.title.from)) || startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"body":{{"from":{0}}}}}', toJSON(github.event.changes.body.from)) || '{}')) && format('Metadata edit / portable / {0}', github.run_id) || 'Portable release smoke' }}
    if: ${{ always() && !(github.event_name == 'pull_request' && github.event.action == 'edited' && (startsWith(toJSON(github.event.changes.title.from), '"') || startsWith(toJSON(github.event.changes.body.from), '"')) && toJSON(github.event.changes) == toJSON(fromJSON(startsWith(toJSON(github.event.changes.title.from), '"') && startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"title":{{"from":{0}}},"body":{{"from":{1}}}}}', toJSON(github.event.changes.title.from), toJSON(github.event.changes.body.from)) || startsWith(toJSON(github.event.changes.title.from), '"') && format('{{"title":{{"from":{0}}}}}', toJSON(github.event.changes.title.from)) || startsWith(toJSON(github.event.changes.body.from), '"') && format('{{"body":{{"from":{0}}}}}', toJSON(github.event.changes.body.from)) || '{}'))) }}
    needs: [plan, build, portable]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful build and selected portable smoke
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
          PORTABLE_SELECTED: ${{ needs.plan.outputs.portable }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$BUILD_RESULT" = success
          case "$PORTABLE_SELECTED" in
            true) test "$PORTABLE_RESULT" = success ;;
            false) test "$PORTABLE_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
