name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - work

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality and production build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: nihongo_test
          POSTGRES_USER: nihongo
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nihongo -d nihongo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://nihongo:ci_only_password@127.0.0.1:5432/nihongo_test?schema=public
      NODE_ENV: test
      TRUSTED_ORIGINS: http://localhost:5173
      LOG_LEVEL: silent
      BETTER_AUTH_SECRET: ci_auth_secret_that_is_at_least_32_chars
      BETTER_AUTH_URL: http://localhost:3001
      GUEST_COOKIE_SECRET: ci_guest_secret_that_is_at_least_32_chars
      AUTH_EMAIL_FROM: auth@example.test
      AUTH_EMAIL_DELIVERY_MODE: test-sink
      AUTH_TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting check
        run: pnpm run format:check

      - name: ESLint
        run: pnpm run lint

      - name: Architecture check
        run: pnpm run check:architecture

      - name: Deploy migrations to fresh test database
        run: pnpm run db:migrate:test

      - name: Seed reviewed question catalog
        run: pnpm run db:seed:test

      - name: Verify idempotent question seed rerun
        run: pnpm run db:seed:test

      - name: TypeScript check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: API integration test
        run: pnpm run test:integration

      - name: Build
        run: pnpm run build

      - name: Git whitespace check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi
