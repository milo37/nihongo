name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - codex/phase-7-admin-cms
      - codex/phase-6-original-content-release
      - codex/phase-5-review-center
      - codex/phase-4-practice-flow
      - main
      - master
      - work

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality and production build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: nihongo_test
          POSTGRES_USER: nihongo
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nihongo -d nihongo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://nihongo:ci_only_password@127.0.0.1:5432/nihongo_test?schema=public
      NODE_ENV: test
      TRUSTED_ORIGINS: http://localhost:5173
      LOG_LEVEL: silent
      BETTER_AUTH_SECRET: ci_auth_secret_that_is_at_least_32_chars
      BETTER_AUTH_URL: http://localhost:3001
      GUEST_COOKIE_SECRET: ci_guest_secret_that_is_at_least_32_chars
      AUTH_EMAIL_FROM: auth@example.test
      AUTH_EMAIL_DELIVERY_MODE: test-sink
      AUTH_TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting check
        run: pnpm run format:check

      - name: ESLint
        run: pnpm run lint

      - name: Architecture check
        run: pnpm run check:architecture

      - name: TypeScript check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Phase 7 database foundation gate
        run: pnpm run test:phase7:db

      - name: Phase 7 technical API gate
        run: pnpm run test:phase7:api

      - name: Production mock mode stays fail closed
        env:
          NODE_ENV: production
          VITE_API_MODE: mock
        run: |
          set -o pipefail
          if pnpm --filter @nihongo/web run build 2>&1 | tee "$RUNNER_TEMP/production-mock-build.log"; then
            echo "Production build unexpectedly accepted VITE_API_MODE=mock." >&2
            exit 1
          fi
          grep -Fq "VITE_API_MODE=mock is forbidden in production." "$RUNNER_TEMP/production-mock-build.log"

      - name: Build
        env:
          NODE_ENV: production
        run: pnpm run build

      - name: Contributor-free content foundation
        run: pnpm run content:foundation-check:static

      - name: Production artifact excludes the mock worker
        run: test ! -e apps/web/dist/mockServiceWorker.js

      - name: Git whitespace check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi

  e2e:
    # Slice 6 owns the Phase 7 real/mock browser cutover. Keep the historical
    # job definition and artifact paths as evidence, but do not run its
    # pre-Phase 7 harness against the Phase 7 migration graph.
    name: Chromium real and mock browser acceptance (pending Slice 6)
    if: ${{ false }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: nihongo_test
          POSTGRES_USER: nihongo
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nihongo -d nihongo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://nihongo:ci_only_password@127.0.0.1:5432/nihongo_test?schema=public
      NODE_ENV: test
      TRUSTED_ORIGINS: http://localhost:5173
      LOG_LEVEL: silent
      BETTER_AUTH_SECRET: ci_auth_secret_that_is_at_least_32_chars
      BETTER_AUTH_URL: http://localhost:3001
      GUEST_COOKIE_SECRET: ci_guest_secret_that_is_at_least_32_chars
      AUTH_EMAIL_FROM: auth@example.test
      AUTH_EMAIL_DELIVERY_MODE: test-sink
      AUTH_TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser acceptance
        run: pnpm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-phase5-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
