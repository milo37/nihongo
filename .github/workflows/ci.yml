name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'

concurrency:
  # Metadata edits must not cancel running or replace pending code checks.
  group: ci-${{ github.ref }}${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select checks for event and changed dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
      metadata_only: ${{ steps.selection.outputs.metadata_only }}
      metadata_build: ${{ steps.previous.outputs.build }}
      metadata_e2e: ${{ steps.previous.outputs.e2e }}
      metadata_portable: ${{ steps.previous.outputs.phase11_release }}
      code: ${{ steps.selection.outputs.code }}
      web: ${{ steps.selection.outputs.web }}
      api: ${{ steps.selection.outputs.api }}
      shared: ${{ steps.selection.outputs.shared }}
      content: ${{ steps.selection.outputs.content }}
      operations: ${{ steps.selection.outputs.operations }}
      database: ${{ steps.selection.outputs.database }}
      browser: ${{ steps.selection.outputs.browser }}
      security: ${{ steps.selection.outputs.security }}
      performance: ${{ steps.selection.outputs.performance }}
      portable: ${{ steps.selection.outputs.portable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
      - name: Select affected checks
        id: selection
        run: node scripts/ci/check-selection.mjs plan
      - name: CI source ${{ steps.selection.outputs.metadata_only == 'true' && 'metadata' || 'code' }} repo ${{ github.repository }} PR ${{ github.event.number }} head ${{ github.event.pull_request.head.sha }} base ${{ github.event.pull_request.base.ref }} ${{ github.event.pull_request.base.sha }} merge ${{ github.sha }}
        if: ${{ github.event_name == 'pull_request' && success() }}
        run: ':'
      - name: Read current code-check results without rerunning checks
        id: previous
        if: ${{ steps.selection.outputs.metadata_only == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/check-selection.mjs previous-results

  build:
    name: Quality and production build
    needs: plan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: ${{ needs.plan.outputs.database == 'true' && needs.plan.outputs.metadata_only != 'true' && 'postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15' || '' }}
        env:
          POSTGRES_DB: nihongo_test
          POSTGRES_USER: nihongo
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nihongo -d nihongo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI_SELECTION: ${{ needs.plan.outputs.selection }}
      CI_PLAN_RESULT: ${{ needs.plan.result }}
      DATABASE_URL: postgresql://nihongo:ci_only_password@127.0.0.1:5432/nihongo_test?schema=public
      NODE_ENV: test
      TRUSTED_ORIGINS: http://localhost:5173
      LOG_LEVEL: silent
      BETTER_AUTH_SECRET: ci_auth_secret_that_is_at_least_32_chars
      BETTER_AUTH_URL: http://localhost:3001
      GUEST_COOKIE_SECRET: ci_guest_secret_that_is_at_least_32_chars
      AUTH_EMAIL_FROM: auth@example.test
      AUTH_EMAIL_DELIVERY_MODE: test-sink
      AUTH_TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128
      PHASE10_SECURITY_EVIDENCE_DIR: test-results/phase10-evidence/security-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Required names must report the actual prior code result, never a skipped success.
      - name: Preserve current code-check result
        if: ${{ needs.plan.outputs.metadata_only == 'true' }}
        env:
          PREVIOUS_CODE_RESULT: ${{ needs.plan.outputs.metadata_build }}
        run: test "$CI_PLAN_RESULT" = success && test "$PREVIOUS_CODE_RESULT" = success

      - name: Checkout
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - name: Setup Node.js
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Record actual checkout evidence
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        run: >-
          node scripts/ci/checkout-evidence.mjs --output
          "$RUNNER_TEMP/checkout-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB.json"

      - name: Upload checkout evidence
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: checkout-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          if-no-files-found: error
          path: ${{ runner.temp }}/checkout-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json

      - name: Install dependencies
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Formatting check
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        id: format
        run: node scripts/ci/check-selection.mjs format

      - name: CI selection contract
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        id: selection_contracts
        run: node --test scripts/ci/*.test.mjs

      - name: Prepare selected package artifacts once
        id: prepare
        if: ${{ needs.plan.outputs.code == 'true' }}
        run: node scripts/ci/check-selection.mjs quality prepare

      - name: ESLint
        if: ${{ needs.plan.outputs.code == 'true' }}
        id: lint
        run: node scripts/ci/check-selection.mjs quality lint

      - name: Architecture check
        if: ${{ needs.plan.outputs.code == 'true' }}
        id: architecture
        run: node scripts/architecture/cli.mjs

      - name: Admin build boundary
        if: ${{ needs.plan.outputs.code == 'true' }}
        id: admin_boundary
        run: pnpm run test:admin-build-boundary

      - name: TypeScript check
        if: ${{ needs.plan.outputs.code == 'true' }}
        id: typecheck
        run: node scripts/ci/check-selection.mjs quality typecheck

      - name: Phase 9 database static contract
        if: ${{ needs.plan.outputs.code == 'true' }}
        id: static_contracts
        run: pnpm run test:phase9:static

      - name: Phase 10 static contract
        id: static_phase10
        if: ${{ needs.plan.outputs.code == 'true' }}
        run: pnpm run test:phase10:static

      - name: Phase 11 static operations contract
        id: static_phase11
        if: ${{ needs.plan.outputs.code == 'true' }}
        run: pnpm run test:phase11:static

      - name: Initialize unique Phase 10 security evidence
        if: ${{ needs.plan.outputs.security == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$PHASE10_SECURITY_EVIDENCE_DIR"
          install -d -m 700 "$PHASE10_SECURITY_EVIDENCE_DIR"

      - name: Phase 10 security gate
        if: ${{ needs.plan.outputs.security == 'true' }}
        id: phase10_security_evidence
        run: pnpm run test:phase10:security

      - name: Upload safe Phase 10 security evidence
        if: ${{ steps.phase10_security_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: security-safe-phase10-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ env.PHASE10_SECURITY_EVIDENCE_DIR }}/

      - name: Clean Phase 10 security evidence
        if: ${{ always() && needs.plan.outputs.security == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          expected="test-results/phase10-evidence/security-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$PHASE10_SECURITY_EVIDENCE_DIR" = "$expected"
          rm -rf -- "$expected"
          test ! -e "$expected"

      - name: Test
        if: ${{ needs.plan.outputs.code == 'true' }}
        id: unit
        run: node scripts/ci/check-selection.mjs quality unit

      - name: Phase 10 complete API integration gate
        if: ${{ needs.plan.outputs.database == 'true' }}
        id: integration
        run: pnpm run test:phase10:api-integration

      - name: Production mock mode stays fail closed
        if: ${{ needs.plan.outputs.web == 'true' }}
        id: production_mock
        env:
          NODE_ENV: production
          VITE_API_MODE: mock
        run: |
          set -o pipefail
          if pnpm --filter @nihongo/web run build 2>&1 | tee "$RUNNER_TEMP/production-mock-build.log"; then
            echo "Production build unexpectedly accepted VITE_API_MODE=mock." >&2
            exit 1
          fi
          grep -Fq "VITE_API_MODE=mock is forbidden in production." "$RUNNER_TEMP/production-mock-build.log"

      - name: Build
        if: ${{ needs.plan.outputs.code == 'true' }}
        id: build
        env:
          NODE_ENV: production
        run: node scripts/ci/check-selection.mjs quality build

      - name: Contributor-free content foundation
        if: ${{ needs.plan.outputs.content == 'true' }}
        id: foundation
        run: |
          pnpm --filter @nihongo/api run content:foundation-check
          pnpm --filter @nihongo/api exec vitest run prisma/phase6Slice1FoundationCheck.test.ts
          pnpm --filter @nihongo/web exec vitest run src/mocks/data/questions/questions.test.ts

      - name: Production artifact excludes the mock worker
        if: ${{ needs.plan.outputs.web == 'true' }}
        id: worker_exclusion
        run: test ! -e apps/web/dist/mockServiceWorker.js

      - name: Initialize unique Phase 10 performance evidence
        if: ${{ needs.plan.outputs.performance == 'true' }}
        env:
          PHASE10_PERFORMANCE_EVIDENCE_DIR: ${{ github.workspace }}/test-results/phase10-evidence/performance-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$PHASE10_PERFORMANCE_EVIDENCE_DIR"
          install -d -m 700 "$PHASE10_PERFORMANCE_EVIDENCE_DIR"

      - name: Phase 10 performance gate
        if: ${{ needs.plan.outputs.performance == 'true' }}
        id: phase10_performance_evidence
        env:
          PHASE10_PERFORMANCE_EVIDENCE_DIR: ${{ github.workspace }}/test-results/phase10-evidence/performance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          pnpm --filter @nihongo/web run test:phase10:bundle
          pnpm run test:phase10:performance:database-api

      - name: Verify Phase 10 performance evidence
        if: ${{ steps.phase10_performance_evidence.outcome == 'success' }}
        env:
          PHASE10_PERFORMANCE_EVIDENCE_DIR: ${{ github.workspace }}/test-results/phase10-evidence/performance-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t evidence_files < <(find "$PHASE10_PERFORMANCE_EVIDENCE_DIR" -mindepth 1 -maxdepth 1 -type f -print | sort)
          test "${#evidence_files[@]}" -eq 2
          for name in bundle.json database-api.json; do
            file="$PHASE10_PERFORMANCE_EVIDENCE_DIR/$name"
            test -f "$file"
            test ! -L "$file"
            test "$(stat -c '%a' "$file")" = 600
          done

      - name: Upload safe Phase 10 performance evidence
        if: ${{ steps.phase10_performance_evidence.outcome == 'success' }}
        env:
          PHASE10_PERFORMANCE_EVIDENCE_DIR: ${{ github.workspace }}/test-results/phase10-evidence/performance-${{ github.run_id }}-${{ github.run_attempt }}
        uses: actions/upload-artifact@v4
        with:
          name: performance-safe-phase10-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ env.PHASE10_PERFORMANCE_EVIDENCE_DIR }}/bundle.json
            ${{ env.PHASE10_PERFORMANCE_EVIDENCE_DIR }}/database-api.json

      - name: Clean Phase 10 performance evidence
        if: ${{ always() && needs.plan.outputs.performance == 'true' }}
        env:
          PHASE10_PERFORMANCE_EVIDENCE_DIR: ${{ github.workspace }}/test-results/phase10-evidence/performance-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_WORKSPACE}/test-results/phase10-evidence/performance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$PHASE10_PERFORMANCE_EVIDENCE_DIR" = "$expected"
          rm -rf -- "$expected"
          test ! -e "$expected"

      - name: Git whitespace check
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Verify selected checks completed
        if: ${{ always() && needs.plan.outputs.metadata_only != 'true' }}
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/check-selection.mjs verify build

  e2e:
    name: Phase 10 real/mock browser and regression acceptance
    needs: plan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: ${{ needs.plan.outputs.browser == 'true' && needs.plan.outputs.metadata_only != 'true' && 'postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15' || '' }}
        env:
          POSTGRES_DB: nihongo_test
          POSTGRES_USER: nihongo
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nihongo -d nihongo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI_SELECTION: ${{ needs.plan.outputs.selection }}
      CI_PLAN_RESULT: ${{ needs.plan.result }}
      DATABASE_URL: postgresql://nihongo:ci_only_password@127.0.0.1:5432/nihongo_test?schema=public
      NODE_ENV: test
      TRUSTED_ORIGINS: http://localhost:5173
      LOG_LEVEL: silent
      BETTER_AUTH_SECRET: ci_auth_secret_that_is_at_least_32_chars
      BETTER_AUTH_URL: http://localhost:3001
      GUEST_COOKIE_SECRET: ci_guest_secret_that_is_at_least_32_chars
      AUTH_EMAIL_FROM: auth@example.test
      AUTH_EMAIL_DELIVERY_MODE: test-sink
      AUTH_TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128
      PHASE10_PLAYWRIGHT_EVIDENCE_DIR: test-results/phase10-evidence/playwright-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Required names must report the actual prior code result, never a skipped success.
      - name: Preserve current code-check result
        if: ${{ needs.plan.outputs.metadata_only == 'true' }}
        env:
          PREVIOUS_CODE_RESULT: ${{ needs.plan.outputs.metadata_e2e }}
        run: test "$CI_PLAN_RESULT" = success && test "$PREVIOUS_CODE_RESULT" = success

      - name: Checkout
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        if: ${{ needs.plan.outputs.browser == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - name: Setup Node.js
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: ${{ needs.plan.outputs.browser == 'true' && 'pnpm' || '' }}

      - name: Record actual checkout evidence
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        run: >-
          node scripts/ci/checkout-evidence.mjs --output
          "$RUNNER_TEMP/checkout-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB.json"

      - name: Upload checkout evidence
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: checkout-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          if-no-files-found: error
          path: ${{ runner.temp }}/checkout-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json

      - name: Install dependencies
        if: ${{ needs.plan.outputs.browser == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: ${{ needs.plan.outputs.browser == 'true' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Initialize unique safe Playwright evidence
        if: ${{ needs.plan.outputs.browser == 'true' }}
        id: phase10_playwright_initialize
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$PHASE10_PLAYWRIGHT_EVIDENCE_DIR"
          install -d -m 700 "$PHASE10_PLAYWRIGHT_EVIDENCE_DIR"

      - name: Phase 10 real browser acceptance
        if: ${{ needs.plan.outputs.browser == 'true' }}
        id: phase10_browser_real
        run: pnpm run test:phase10:browser:real

      # Later groups are diagnostic; earlier step failures still fail this job.
      - name: Phase 10 canonical mock browser acceptance
        id: phase10_browser_mock
        if: ${{ !cancelled() && steps.phase10_playwright_initialize.outcome == 'success' }}
        run: pnpm run test:phase10:browser:mock

      - name: Verify safe Playwright evidence
        id: phase10_playwright_evidence
        if: ${{ !cancelled() && steps.phase10_playwright_initialize.outcome == 'success' }}
        run: >-
          node scripts/security/security-evidence.mjs verify
          --directory "$PHASE10_PLAYWRIGHT_EVIDENCE_DIR"
          --profile playwright
          --required phase8-real,phase8-mock,phase9-real,phase9-mock,phase10-real,phase10-mock

      - name: Upload safe Playwright evidence
        if: ${{ steps.phase10_playwright_evidence.outcome == 'success' && steps.phase10_browser_real.outcome == 'success' && steps.phase10_browser_mock.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-safe-phase10-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ env.PHASE10_PLAYWRIGHT_EVIDENCE_DIR }}/

      - name: Clean safe Playwright evidence
        if: ${{ always() && needs.plan.outputs.browser == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          expected="test-results/phase10-evidence/playwright-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$PHASE10_PLAYWRIGHT_EVIDENCE_DIR" = "$expected"
          rm -rf -- "$expected"
          test ! -e "$expected"

      - name: Clean raw Playwright output
        if: ${{ always() && needs.plan.outputs.browser == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          expected="test-results/phase10-raw"
          rm -rf -- "$expected"
          test ! -e "$expected"

      - name: Clean Phase 9 browser diagnostics
        if: ${{ always() && needs.plan.outputs.browser == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          expected="test-results/playwright-phase9-real"
          rm -rf -- "$expected"
          test ! -e "$expected"

      - name: Verify selected checks completed
        if: ${{ always() && needs.plan.outputs.metadata_only != 'true' }}
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/check-selection.mjs verify e2e

  phase11_release:
    name: Phase 11 portable release and production-mode smoke
    needs: plan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_SELECTION: ${{ needs.plan.outputs.selection }}
      CI_PLAN_RESULT: ${{ needs.plan.result }}
    steps:
      # Required names must report the actual prior code result, never a skipped success.
      - name: Preserve current code-check result
        if: ${{ needs.plan.outputs.metadata_only == 'true' }}
        env:
          PREVIOUS_CODE_RESULT: ${{ needs.plan.outputs.metadata_portable }}
        run: test "$CI_PLAN_RESULT" = success && test "$PREVIOUS_CODE_RESULT" = success

      - name: Checkout
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        if: ${{ needs.plan.outputs.portable == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - name: Setup Node.js
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: ${{ needs.plan.outputs.portable == 'true' && 'pnpm' || '' }}

      - name: Record actual checkout evidence
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        run: >-
          node scripts/ci/checkout-evidence.mjs --output
          "$RUNNER_TEMP/checkout-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB.json"

      - name: Upload checkout evidence
        if: ${{ needs.plan.outputs.metadata_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: checkout-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          if-no-files-found: error
          path: ${{ runner.temp }}/checkout-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json

      - name: Install dependencies
        if: ${{ needs.plan.outputs.portable == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build and verify portable Phase 11 OCI release
        if: ${{ needs.plan.outputs.portable == 'true' }}
        id: phase11_release
        env:
          PHASE11_IMAGE_TAG: nihongo-phase11:${{ github.run_id }}-${{ github.run_attempt }}
          PHASE11_CONTAINER_NAME: nihongo-phase11-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          PHASE11_RELEASE_EVIDENCE_DIR: ${{ github.workspace }}/test-results/phase11-evidence/release-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -e "$PHASE11_RELEASE_EVIDENCE_DIR"
          install -d -m 700 "$PHASE11_RELEASE_EVIDENCE_DIR"
          docker build --build-arg "RELEASE_ID=${GITHUB_SHA}" --tag "$PHASE11_IMAGE_TAG" .
          image_id="$(docker image inspect --format '{{.Id}}' "$PHASE11_IMAGE_TAG")"
          docker create --name "$PHASE11_CONTAINER_NAME" "$PHASE11_IMAGE_TAG"
          docker cp "$PHASE11_CONTAINER_NAME:/app/release-manifest.json" "$PHASE11_RELEASE_EVIDENCE_DIR/release-manifest.json"
          docker rm "$PHASE11_CONTAINER_NAME"
          chmod 600 "$PHASE11_RELEASE_EVIDENCE_DIR/release-manifest.json"
          pnpm run release:manifest --mode verify --input "$PHASE11_RELEASE_EVIDENCE_DIR/release-manifest.json"
          pnpm run release:evidence --mode create --release-id "$GITHUB_SHA" --image-id "$image_id" --manifest "$PHASE11_RELEASE_EVIDENCE_DIR/release-manifest.json" --output "$PHASE11_RELEASE_EVIDENCE_DIR/oci-evidence.json"
          pnpm run release:evidence --mode verify --input "$PHASE11_RELEASE_EVIDENCE_DIR/oci-evidence.json"
          # Generate only the host TEST seed client after the image is frozen.
          pnpm run db:generate
          pnpm run release:runtime-smoke --image "$image_id" --expected-image-id "$image_id" --release-id "$GITHUB_SHA" --output "$PHASE11_RELEASE_EVIDENCE_DIR/runtime-smoke.json"
          pnpm run release:runtime-smoke --mode verify --expected-image-id "$image_id" --input "$PHASE11_RELEASE_EVIDENCE_DIR/runtime-smoke.json"
          for name in release-manifest.json oci-evidence.json runtime-smoke.json; do
            file="$PHASE11_RELEASE_EVIDENCE_DIR/$name"
            test -f "$file"
            test ! -L "$file"
            test "$(stat -c '%a' "$file")" = 600
          done

      - name: Upload safe Phase 11 release evidence
        if: ${{ steps.phase11_release.outcome == 'success' }}
        env:
          PHASE11_RELEASE_EVIDENCE_DIR: ${{ github.workspace }}/test-results/phase11-evidence/release-${{ github.run_id }}-${{ github.run_attempt }}
        uses: actions/upload-artifact@v4
        with:
          name: release-safe-phase11-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ env.PHASE11_RELEASE_EVIDENCE_DIR }}/release-manifest.json
            ${{ env.PHASE11_RELEASE_EVIDENCE_DIR }}/oci-evidence.json
            ${{ env.PHASE11_RELEASE_EVIDENCE_DIR }}/runtime-smoke.json

      - name: Clean Phase 11 release and evidence
        if: ${{ always() && needs.plan.outputs.portable == 'true' }}
        env:
          PHASE11_IMAGE_TAG: nihongo-phase11:${{ github.run_id }}-${{ github.run_attempt }}
          PHASE11_CONTAINER_NAME: nihongo-phase11-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          PHASE11_RELEASE_EVIDENCE_DIR: ${{ github.workspace }}/test-results/phase11-evidence/release-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          expected_evidence="${GITHUB_WORKSPACE}/test-results/phase11-evidence/release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$PHASE11_RELEASE_EVIDENCE_DIR" = "$expected_evidence"
          if docker container inspect "$PHASE11_CONTAINER_NAME" >/dev/null 2>&1; then docker rm -f "$PHASE11_CONTAINER_NAME"; fi
          if docker image inspect "$PHASE11_IMAGE_TAG" >/dev/null 2>&1; then docker image rm -f "$PHASE11_IMAGE_TAG"; fi
          rm -rf -- "$expected_evidence"
          test ! -e "$expected_evidence"

      - name: Verify selected checks completed
        if: ${{ always() && needs.plan.outputs.metadata_only != 'true' }}
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/check-selection.mjs verify phase11_release
