name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - work

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Record actual checkout evidence
        run: >-
          node scripts/ci/checkout-evidence.mjs --output
          "$RUNNER_TEMP/checkout-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB.json"

      - name: Upload checkout evidence
        uses: actions/upload-artifact@v4
        with:
          name: checkout-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          if-no-files-found: error
          path: ${{ runner.temp }}/checkout-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting check
        run: pnpm run format:check

      - name: ESLint
        run: pnpm run lint

      - name: Architecture check
        run: pnpm run check:architecture

      - name: TypeScript check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
