name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # New commits in this push or pull request.
      - name: Scan new commits
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false

      # Every tracked file at this commit, like the removed tracked-source-security.mjs.
      - name: Scan tracked tree
        run: >-
          git ls-files -z | tar --null -T - -cf - | docker run --rm -i
          -v "$PWD/.gitleaks.toml:/config/.gitleaks.toml:ro" --entrypoint sh "$GITLEAKS_IMAGE"
          -c 'mkdir /scan && tar -xf - -C /scan && gitleaks dir /scan --config /config/.gitleaks.toml --redact --verbose --no-banner'

      # Proves the rules still fire: fake secrets are built at run time, never committed.
      - name: Detection canary
        run: |
          canary="$RUNNER_TEMP/canary"
          mkdir -p "$canary"
          # Random order, fixed letter counts: the entropy of each value is set,
          # so a rule's entropy floor never drops a canary (JLP-807: a random
          # 32-hex value had entropy 3.0 and missed the > 3.0 hex rules).
          pick() { printf '%s' "$1" | fold -w1 | shuf -n "$2" | tr -d '\n'; }
          hex=0123456789abcdef
          k="AKIA$(pick ABCDEFGHIJKLMNOPQRSTUVWXYZ234567 16)"
          g="ghp_$(pick "$hex" 16)$(pick "$hex" 16)$(pick "$hex" 4)"
          p="$(pick "$hex" 16)$(pick "$hex" 16)"
          # One letter case and no K or X: the rule allowlists match words in any
          # case, and each needs a repeated letter, K, X or "_" (fake, test, ...).
          q="$(pick ABCDEFGHIJLMNOPQRSTUVWYZ0123456789 32)"
          printf 'aws_key = %s\n' "$k" > "$canary/aws.txt"
          printf 'token: %s\n' "$g" > "$canary/github.txt"
          printf 'DATABASE_URL=postgres://app:%s@db.internal:5432/app\n' "$p" > "$canary/uri.txt"
          printf 'client_secret = "%s"\n' "$p" > "$canary/assign.txt"
          printf 'DATABASE_URL=postgres://app:%s@db.internal:5432/app\n' "$q" > "$canary/uri-alnum.txt"
          printf 'client_secret = "%s"\n' "$q" > "$canary/assign-alnum.txt"
          printf -- '-----BEGIN RSA PRIVATE KEY-----\n%s\n-----END RSA PRIVATE KEY-----\n' "$(openssl rand -base64 600 | tr -d '\n' | fold -w 64)" > "$canary/key.pem"
          set +e
          docker run --rm -v "$canary:/scan:ro" -v "$PWD/.gitleaks.toml:/config/.gitleaks.toml:ro" -v "$RUNNER_TEMP:/out" \
            "$GITLEAKS_IMAGE" dir /scan --config /config/.gitleaks.toml --redact --no-banner \
            --report-format json --report-path /out/canary.json
          status=$?
          set -e
          test "$status" -eq 1
          found="$(jq -r '[.[].File | split("/") | last] | unique | join(" ")' "$RUNNER_TEMP/canary.json")"
          echo "detected: $found"
          for file in assign.txt assign-alnum.txt aws.txt github.txt key.pem uri.txt uri-alnum.txt; do
            case " $found " in *" $file "*) ;; *) echo "canary not detected: $file" >&2; exit 1 ;; esac
          done
