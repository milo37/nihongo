name: Deploy a release to one host through SSM
description: >-
  Shared by Deploy to STAGING and Deploy to PRODUCTION (release-image.yml).
  Deploys only while this SHA is the tip of main, runs the host's deploy
  document with releaseId = this SHA, and waits for /health/ready 200 with
  this release. The repository is public: only the status and the known
  deploy.sh result lines are printed.
inputs:
  role-arn:
    description: OIDC deploy role of this environment.
    required: true
  aws-region:
    required: true
  instance-id:
    required: true
  site-url:
    required: true
  deploy-document:
    description: SSM document the role may send (harumaru-<env>-deploy).
    required: true
  start-if-stopped:
    description: "'true' starts a stopped host first (STAGING kept stopped between uses)."
    default: 'false'
  stop-after-minutes:
    description: "Minutes after this deploy at which the host stops itself (STAGING kept stopped between uses); '0' leaves it running."
    default: '0'
  github-token:
    required: true
outputs:
  deployed:
    description: "'true' when this SHA is now live on the host."
    value: ${{ steps.health.outputs.deployed == 'true' }}
runs:
  using: composite
  steps:
    # Re-running an old run must not put the host back on an older SHA:
    # deploy only while this SHA is still the tip of main.
    - name: Check this SHA is the tip of main
      id: tip
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        tip=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
          -H 'Accept: application/vnd.github.sha' \
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main")
        if [ "$tip" = "$GITHUB_SHA" ]; then
          echo "latest=true" >> "$GITHUB_OUTPUT"
        else
          echo "latest=false" >> "$GITHUB_OUTPUT"
          echo "::notice::skipped: $GITHUB_SHA is not the tip of main ($tip); re-run the newest run instead"
        fi

    - name: Assume the deploy role (OIDC, no stored keys)
      if: steps.tip.outputs.latest == 'true'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Start the host if it is stopped
      if: steps.tip.outputs.latest == 'true' && inputs.start-if-stopped == 'true'
      shell: bash
      env:
        INSTANCE_ID: ${{ inputs.instance-id }}
      run: |
        state=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
          --query 'Reservations[0].Instances[0].State.Name' --output text)
        echo "host $state"
        if [ "$state" = stopping ]; then
          aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
          state=stopped
        fi
        if [ "$state" = stopped ]; then
          aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
        fi
        # Run Command needs the SSM agent online (about a minute after boot).
        for _ in $(seq 1 30); do
          ping=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)
          [ "$ping" = Online ] && { echo "ssm agent online"; exit 0; }
          sleep 10
        done
        echo "::error::SSM agent not online 5 minutes after start"
        exit 1

    - name: Run the deploy document on the host
      if: steps.tip.outputs.latest == 'true'
      shell: bash
      env:
        INSTANCE_ID: ${{ inputs.instance-id }}
        DEPLOY_DOCUMENT: ${{ inputs.deploy-document }}
        STOP_AFTER_MINUTES: ${{ inputs.stop-after-minutes }}
      run: |
        # Only sent when set, so a host whose document has no stopAfterMinutes
        # yet (PRODUCTION, or before the Terraform apply) still deploys.
        parameters="releaseId=$GITHUB_SHA"
        if [ "$STOP_AFTER_MINUTES" != 0 ]; then
          parameters="$parameters,stopAfterMinutes=$STOP_AFTER_MINUTES"
        fi
        cid=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
          --document-name "$DEPLOY_DOCUMENT" --parameters "$parameters" \
          --comment "release-image $GITHUB_RUN_ID" \
          --query Command.CommandId --output text)
        echo "command $cid"
        deadline=$((SECONDS + 1500))
        while :; do
          st=$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" \
            --query Status --output text 2>/dev/null || true)
          case "$st" in
            Pending|InProgress|Delayed|"") ;;
            *) break ;;
          esac
          if [ "$SECONDS" -ge "$deadline" ]; then echo "::error::deploy still $st after 25 minutes"; exit 1; fi
          sleep 15
        done
        echo "status $st"
        # A document with more than one step (deploy, stopLater) has no
        # top-level output, so read each step by name. One field per call: a
        # text query of both fields joins them with a tab, which would hide the
        # first stderr line from the filter.
        steps=$(aws ssm list-command-invocations --command-id "$cid" --instance-id "$INSTANCE_ID" \
          --details --query 'CommandInvocations[0].CommandPlugins[].Name' --output text)
        for step in $steps; do
          for field in StandardOutputContent StandardErrorContent; do
            aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" \
              --plugin-name "$step" --query "$field" --output text
          done
        done | grep -E '^(deployed [0-9a-f]{40}|refusing: |health check failed|rolled back|another deploy is running|release must be|host stops in [0-9]+ minutes)' || true
        [ "$st" = Success ] || { echo "::error::deploy $st"; exit 1; }

    - name: Wait for /health/ready 200 with this release
      id: health
      if: steps.tip.outputs.latest == 'true'
      shell: bash
      env:
        SITE_URL: ${{ inputs.site-url }}
      run: |
        for _ in $(seq 1 30); do
          : > headers.txt
          code=$(curl -sS -o /dev/null -D headers.txt -w '%{http_code}' "$SITE_URL/health/ready" || true)
          release=$(tr -d '\r' < headers.txt | awk 'tolower($1)=="x-release-id:"{print $2}')
          if [ "$code" = 200 ] && { [ -z "$release" ] || [ "$release" = "$GITHUB_SHA" ]; }; then
            echo "ready 200 release ${release:-not shown by the edge}"
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 10
        done
        echo "::error::$SITE_URL/health/ready gave $code (release ${release:-none})"
        exit 1
