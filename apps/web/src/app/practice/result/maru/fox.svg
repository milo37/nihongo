<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<style>
.o{stroke:var(--fox-line,#D9975A);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.b{fill:var(--fox-body,#FED1A0)}.c{fill:var(--fox-cream,#FFF4E8)}.n{fill:none}
.k{fill:var(--fox-cheek,#FFC8B8)}.e{fill:var(--fox-eye,#4E3828)}.s{fill:none;stroke:var(--fox-eye,#4E3828);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nz{fill:var(--fox-nose,#8A5A3C)}.r{fill:var(--maru-red,rgb(200,64,42))}.rl{fill:none;stroke:var(--maru-red,rgb(200,64,42));stroke-width:3;stroke-linecap:round}
.al{fill:none;stroke:var(--fox-line,#D9975A);stroke-width:8.5;stroke-linecap:round}.ab{fill:none;stroke:var(--fox-body,#FED1A0);stroke-width:5.5;stroke-linecap:round}
.d{fill:none;stroke:var(--fox-line,#D9975A);stroke-width:1.6;stroke-dasharray:4 4;stroke-linecap:round}
</style>
<defs>
<clipPath id="fx-tailclip"><path d="M36 80C22 86 7 78 9 62C10 52 18 48 23 53C21 62 27 70 38 72Z"/></clipPath>
<!-- tail (behind body) -->
<g id="fx-tail"><path class="b" d="M36 80C22 86 7 78 9 62C10 52 18 48 23 53C21 62 27 70 38 72Z"/><g clip-path="url(#fx-tailclip)"><path class="c" d="M4 50H26L22 58L18 56L15 61L11 58L4 64Z"/></g><path class="o n" d="M36 80C22 86 7 78 9 62C10 52 18 48 23 53C21 62 27 70 38 72"/></g>
<!-- sitting body -->
<g id="fx-body"><path class="b o" d="M34 58C30 68 30 80 32 88H64C66 80 66 68 62 58Z"/><path class="c" d="M38 59H58C58 67 55 72 52 75L50 72L48 76L46 72L44 75C41 72 38 67 38 59Z"/><ellipse class="c o" cx="37" cy="87" rx="7" ry="3.8"/><ellipse class="c o" cx="59" cy="87" rx="7" ry="3.8"/></g>
<g id="fx-paws"><ellipse class="c o" cx="42.5" cy="82" rx="4.5" ry="4"/><ellipse class="c o" cx="53.5" cy="82" rx="4.5" ry="4"/></g>
<!-- head without eyes: ears, head, cream face, nose, cheeks (same in every pose) -->
<g id="fx-head">
<path class="b o" d="M27 31L24 10Q25 6 29 8L43 22Z"/><path class="c" d="M28.5 27L27 13L37 22Z"/>
<path class="b o" d="M69 31L72 10Q71 6 67 8L53 22Z"/><path class="c" d="M67.5 27L69 13L59 22Z"/>
<path class="b" d="M48 20C64 20 74 28 74 40C74 46 72 50 76 54L70 55C66 59 58 61 48 61C38 61 30 59 26 55L20 54C24 50 22 46 22 40C22 28 32 20 48 20Z"/>
<path class="c" d="M23.5 45C28 41 36 41 42 43L48 45.5L54 43C60 41 68 41 72.5 45C73 50 74 53 76 54L70 55C66 59 58 61 48 61C38 61 30 59 26 55L20 54C22 52 23 49 23.5 45Z"/>
<path class="o n" d="M48 20C64 20 74 28 74 40C74 46 72 50 76 54L70 55C66 59 58 61 48 61C38 61 30 59 26 55L20 54C24 50 22 46 22 40C22 28 32 20 48 20Z"/>
<ellipse class="k" cx="30.5" cy="50" rx="4.5" ry="3"/><ellipse class="k" cx="65.5" cy="50" rx="4.5" ry="3"/>
<ellipse class="nz" cx="48" cy="47.5" rx="2.5" ry="1.75"/>
</g>
<g id="fx-armL"><path class="al" d="M30 56C22 40 25 22 36 12"/><path class="ab" d="M30 56C22 40 25 22 36 12"/></g>
<g id="fx-armR"><path class="al" d="M66 56C74 40 71 22 60 12"/><path class="ab" d="M66 56C74 40 71 22 60 12"/></g>
<g id="fx-eyes-dot"><circle class="e" cx="37" cy="44" r="3"/><circle class="e" cx="59" cy="44" r="3"/></g>
<g id="fx-eyes-up"><circle class="e" cx="37" cy="43" r="3"/><circle class="e" cx="59" cy="43" r="3"/></g>
<g id="fx-eyes-shut"><path class="s" d="M34 41L39 44L34 47M62 41L57 44L62 47"/></g>
<g id="fx-eyes-smile"><path class="s" d="M33.5 45Q37 40.5 40.5 45M55.5 45Q59 40.5 62.5 45"/></g>
<g id="fx-eyes-sleep"><path class="s" d="M33.5 43Q37 47 40.5 43M55.5 43Q59 47 62.5 43"/></g>
<!-- stamp, bottom centre at 0,0 -->
<g id="fx-stamp"><circle class="c o" cx="0" cy="-19" r="4.5"/><path class="c o" d="M-3.5 -15.5H3.5V-14C6.5 -14 9 -12.5 9 -10V-5H-9V-10C-9 -12.5 -6.5 -14 -3.5 -14Z"/><path class="r o" d="M-10 -5H10V-1.5C10 -0.6 9.4 0 8.5 0H-8.5C-9.4 0 -10 -0.6 -10 -1.5Z"/></g>
<g id="fx-stamp-plain"><circle class="c o" cx="0" cy="-19" r="4.5"/><path class="c o" d="M-3.5 -15.5H3.5V-14C6.5 -14 9 -12.5 9 -10V-5H-9V-10C-9 -12.5 -6.5 -14 -3.5 -14Z"/><path class="c o" d="M-10 -5H10V-1.5C10 -0.6 9.4 0 8.5 0H-8.5C-9.4 0 -10 -0.6 -10 -1.5Z"/></g>
<path id="fx-ring" d="M15.5 3.2C9 1.6 3 5.6 3.4 11.6c.4 5.6 7 8.4 12.2 6.2 4.6-2 5.6-7.6 2.4-11.4"/>
</defs>

<symbol id="fox-front" viewBox="0 0 96 96"><use href="#fx-tail"/><use href="#fx-body"/><use href="#fx-paws"/><use href="#fx-head"/><use href="#fx-eyes-dot"/></symbol>

<symbol id="fox-lift" viewBox="0 0 96 96"><g transform="translate(48 88) scale(.8) translate(-48 -88)">
<use href="#fx-tail"/><use href="#fx-body"/><use href="#fx-armL"/><use href="#fx-armR"/><use href="#fx-head"/><use href="#fx-eyes-up"/>
<use href="#fx-stamp" transform="translate(48 12)"/>
<ellipse class="c o" cx="36.5" cy="10" rx="4.6" ry="4.3"/><ellipse class="c o" cx="59.5" cy="10" rx="4.6" ry="4.3"/></g></symbol>

<symbol id="fox-thud" viewBox="0 0 96 96"><g transform="translate(-6 0) rotate(9 48 88) translate(48 88) scale(.84) translate(-48 -88)">
<use href="#fx-tail"/><use href="#fx-body"/><g transform="rotate(4 48 60)"><use href="#fx-head"/><use href="#fx-eyes-shut"/></g></g>
<use href="#fx-stamp" transform="translate(78 88)"/>
<path class="al" d="M57 68Q67 64 75 68"/><path class="ab" d="M57 68Q67 64 75 68"/>
<ellipse class="c o" cx="81.5" cy="68" rx="4.3" ry="3.8"/><ellipse class="c o" cx="75" cy="68.5" rx="4.3" ry="3.8"/></symbol>

<symbol id="fox-yay" viewBox="0 0 96 96"><g transform="translate(-6 0) translate(48 88) scale(.84) translate(-48 -88)">
<g transform="rotate(-12 34 80)"><use href="#fx-tail"/></g><use href="#fx-body"/><use href="#fx-head"/><use href="#fx-eyes-smile"/>
<path class="al" d="M33 60Q26 60 21 55"/><path class="ab" d="M33 60Q26 60 21 55"/><ellipse class="c o" cx="20" cy="54" rx="4.5" ry="4.2"/></g>
<use href="#fx-stamp" transform="translate(73 38) rotate(14)"/>
<path class="al" d="M55 64C61 60 66 51 69 42"/><path class="ab" d="M55 64C61 60 66 51 69 42"/>
<ellipse class="c o" cx="69.5" cy="39.5" rx="4.3" ry="3.8"/></symbol>

<symbol id="fox-empty" viewBox="0 0 96 96"><g transform="translate(-10 0) translate(48 88) scale(.8) translate(-48 -88)">
<use href="#fx-tail"/><use href="#fx-body"/><use href="#fx-paws"/><g transform="rotate(7 48 60)"><use href="#fx-head"/><use href="#fx-eyes-dot"/></g></g>
<ellipse class="d" cx="72" cy="86" rx="12" ry="4.5"/>
<use href="#fx-stamp-plain" transform="translate(89 88) scale(.75)"/></symbol>

<symbol id="fox-error" viewBox="0 0 96 96">
<path class="b o" d="M20 88C14 88 12 80 16 74C22 64 40 62 58 64C74 66 84 72 84 80C84 86 80 88 76 88Z"/>
<path class="b o" d="M84 80C88 72 84 62 76 62C86 66 86 78 72 84C60 89 40 89 30 86L40 88H76C80 88 83 85 84 80Z"/>
<path class="c" d="M76 62C86 66 86 78 72 84L74 79L70 80L72 75L68 75Z"/>
<path class="o n" d="M84 80C88 72 84 62 76 62C86 66 86 78 72 84C60 89 40 89 30 86"/>
<g transform="translate(30 70) scale(.68) rotate(-6) translate(-48 -42)"><use href="#fx-head"/><use href="#fx-eyes-sleep"/></g>
<ellipse class="c o" cx="44" cy="86" rx="5" ry="3.2"/><ellipse class="c o" cx="53" cy="86.5" rx="5" ry="3.2"/></symbol>

<symbol id="maru-ring" viewBox="0 0 24 22"><use href="#fx-ring" class="rl"/></symbol>
<symbol id="stamp-16" viewBox="0 0 16 16"><g transform="translate(1.5 1.6) scale(.54)"><use href="#fx-ring" class="rl" style="stroke-width:3.2"/></g></symbol>
</svg>
