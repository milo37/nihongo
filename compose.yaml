services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nihongo_dev}
      POSTGRES_USER: ${POSTGRES_USER:-nihongo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LOCAL_DATABASE_PROVISIONING: '0'
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - nihongo-postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  # Persistent local runtime roles intentionally live outside the disposable
  # integration-runner cluster. The runner rejects pre-existing wrapper logins.
  postgres-local:
    profiles: ['local-db']
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: nihongo_dev
      POSTGRES_USER: ${POSTGRES_USER:-nihongo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LOCAL_DATABASE_PROVISIONING: '1'
      TEST_MIGRATION_PASSWORD: ${TEST_MIGRATION_PASSWORD:-}
      TEST_APP_PASSWORD: ${TEST_APP_PASSWORD:-}
      TEST_GUEST_CLEANUP_WORKER_PASSWORD: ${TEST_GUEST_CLEANUP_WORKER_PASSWORD:-}
      DEVELOPMENT_MIGRATION_PASSWORD: ${DEVELOPMENT_MIGRATION_PASSWORD:-}
      DEVELOPMENT_APP_PASSWORD: ${DEVELOPMENT_APP_PASSWORD:-}
      DEVELOPMENT_GUEST_CLEANUP_WORKER_PASSWORD: ${DEVELOPMENT_GUEST_CLEANUP_WORKER_PASSWORD:-}
    ports:
      - '127.0.0.1:${LOCAL_POSTGRES_PORT:-55433}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -f "$${PGDATA}/.nihongo-local-provisioned" && pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - nihongo-local-postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  nihongo-postgres-data:
  nihongo-local-postgres-data:
