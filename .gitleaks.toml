# Secret scanning for tracked files and commits (gitleaks default rules plus the
# two project rules the removed tracked-source-security.mjs enforced).
title = "nihongo"

[extend]
useDefault = true

# postgres://user:<20+ char password>@host and the same for other database URIs.
[[rules]]
id = "credential-uri-password"
description = "Database or broker URI with an embedded password"
regex = '''(?i)\b(?:amqps?|mariadb|mongodb(?:\+srv)?|mysql|postgres(?:ql)?|rediss?)://[^\s:/@]+:([^\s/@?#]{20,})@'''
secretGroup = 1
keywords = ["://"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''(?i)(changeme|dummy|example|fake|fixture|mock|placeholder|replace|test|ci_)''']

# password = "<20+ chars>", client_secret: '<20+ chars>' and similar.
[[rules]]
id = "sensitive-assignment"
description = "Credential-like name assigned a long literal"
regex = '''(?i)["'`]?(?:api[_-]?key|auth[_-]?token|access[_-]?token|refresh[_-]?token|client[_-]?secret|password|private[_-]?key|secret)["'`]?\s*[:=]\s*["'`]([A-Za-z0-9+/=_-]{20,})["'`]'''
secretGroup = 1
keywords = ["key", "token", "secret", "password"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''(?i)(changeme|dummy|example|fake|fixture|mock|placeholder|replace|test|ci_)''']
